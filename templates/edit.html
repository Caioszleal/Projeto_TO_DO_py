<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Editar tarefa</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>✏️ Editar tarefa</h1>

    <form action="{{ url_for('update', id=task[0]) }}" method="POST">
        <input type="text" name="task" value="{{ task[1] }}" required>
        <input type="date" name="deadline" value="{{ task[3] }}">
        <button type="submit">Salvar</button>
    </form>

    <br>
    <a href="{{ url_for('index') }}">⬅ Voltar</a>
</div>

</body>
</html>
